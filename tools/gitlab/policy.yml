stages:
  - policy

policy:guard-new-files:
  stage: policy
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - apk add --no-cache git
    - echo "Scanning for newly added files outside allowed paths..."
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        BASE_REF="origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      else
        BASE_REF="origin/${CI_DEFAULT_BRANCH:-main}"
      fi
      git fetch origin "+refs/heads/*:refs/remotes/origin/*"
      ADDED=$(git --no-pager diff --name-status "$BASE_REF"...HEAD | awk '$1=="A"{print $2}')
      echo "Added files:\n$ADDED"
      EXIT=0
      for f in $ADDED; do
        case "$f" in
          upstream/wine/*) ;;
          m4/*) ;;
          tools/gitlab/*) ;;
          libs/compatibility/*) ;;
          libs/*/Makefile.am) ;;
          configure.ac|Makefile.am|include/config.h.in|aclocal.m4) ;;
          *) echo "Disallowed new file: $f"; EXIT=1 ;;
        esac
      done
      exit $EXIT
